services:
  - type: web
    name: stealth-calc
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20.11.1"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
